[project]
name = "deltaquery"
version = "0.0.1"
description = "Dependency-aware incremental retrieval runtime (research prototype)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.6",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deltaquery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: needs the local Ollama server (no other network)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["deltaquery"]

[tool.ruff.lint.per-file-ignores]
# Prompt text: re-wrapping would change the prompt (and invalidate recorded outputs).
"deltaquery/compiler/compiler.py" = ["E501"]
